<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Downtime Tracker Dashboard — monitor all your websites.">
    <title>Dashboard — Downtime Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dash-layout">
        <header class="dash-header">
            <h1>Downtime Tracker</h1>
            <div class="user-meta">
                <span id="userEmail" class="user-email"></span>
                <button id="logoutBtn" class="btn btn-sm">Logout</button>
            </div>
        </header>

        <section class="dash-section">
            <p class="section-label">Track a website</p>
            <div class="add-row">
                <input type="text" id="websiteUrl" placeholder="https://example.com">
                <button id="addBtn" class="btn btn-primary">Add</button>
                <button id="forceCheckBtn" class="btn">Check all</button>
            </div>
            <p id="addMessage" class="msg"></p>
        </section>

        <section class="dash-section">
            <p class="section-label">Monitored websites</p>
            <ul id="websiteList" class="site-list">
                <li class="state-text">Loading...</li>
            </ul>
        </section>
    </div>

    <div id="toast"></div>

    <script src="/config.js"></script>
    <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
