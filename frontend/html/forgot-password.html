<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Downtime Tracker password.">
    <title>Forgot Password — Downtime Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-box">
            <p class="auth-logo">Downtime Tracker</p>
            <h1>Forgot password</h1>
            <p class="subtitle">Enter your email and we'll send a reset link</p>

            <form id="forgotForm" class="form-stack" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Send reset link</button>
            </form>

            <p id="authMessage" class="msg"></p>

            <div class="auth-footer">
                <span>Back to <a href="./login.html">login</a></span>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
