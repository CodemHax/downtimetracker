<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account on Downtime Tracker to start monitoring your websites.">
    <title>Register — Downtime Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-box">
            <p class="auth-logo">Downtime Tracker</p>
            <h1>Create account</h1>
            <p class="subtitle">Start monitoring your websites</p>

            <form id="registerForm" class="form-stack" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Password <span style="color:var(--fg-3);font-weight:400;">(min 6 chars)</span></label>
                    <input type="password" id="password" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Create account</button>
            </form>

            <p id="authMessage" class="msg"></p>

            <div class="auth-footer">
                <span>Already have an account? <a href="./login.html">Sign in</a></span>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/register.js"></script>
</body>
</html>
