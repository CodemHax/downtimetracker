<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your Downtime Tracker account.">
    <title>New Password — Downtime Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-box">
            <p class="auth-logo">Downtime Tracker</p>
            <h1>New password</h1>
            <p class="subtitle">Enter your new password below</p>

            <form id="resetForm" class="form-stack" novalidate>
                <input type="hidden" id="email">
                <input type="hidden" id="token">
                <div class="field">
                    <label for="password">New password <span style="color:var(--fg-3);font-weight:400;">(min 6 chars)</span></label>
                    <input type="password" id="password" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Reset password</button>
            </form>

            <p id="authMessage" class="msg"></p>

            <div class="auth-footer">
                <span>Back to <a href="./login.html">login</a></span>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
