<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Downtime Tracker to monitor your websites.">
    <title>Login — Downtime Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-box">
            <p class="auth-logo">Downtime Tracker</p>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your account</p>

            <form id="loginForm" class="form-stack" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Sign in</button>
            </form>

            <p id="authMessage" class="msg"></p>

            <div class="auth-footer">
                <span><a href="./forgot-password.html">Forgot password?</a></span>
                <span>No account? <a href="./register.html">Register</a></span>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/login.js"></script>
</body>
</html>
